worker_processes auto;
events { worker_connections 1024; }

http {
    # ── Large uploads (up to 2 GB) ─────────────────────────────────────────
    client_max_body_size 2048m;
    client_body_timeout  300s;
    proxy_read_timeout   300s;

    # ── Upstream services ──────────────────────────────────────────────────
    upstream api      { server api:8000; }
    upstream frontend { server frontend:3000; }

    server {
        listen 80;
        server_name _;

        # ── Frontend (Next.js) ─────────────────────────────────────────────
        location / {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_cache_bypass $http_upgrade;
        }

        # ── Backend API ────────────────────────────────────────────────────
        location ~ ^/(jobs|health) {
            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

            # SSE: disable buffering so events reach the browser instantly
            proxy_buffering    off;
            proxy_cache        off;
            proxy_set_header   Connection '';
            chunked_transfer_encoding on;
        }
    }

    # ── HTTPS (uncomment and set server_name when you have a domain) ───────
    # server {
    #     listen 443 ssl;
    #     server_name yourdomain.com;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #
    #     location / { ... same as above ... }
    #     location ~ ^/(jobs|health) { ... same as above ... }
    # }
}
