name: Deploy to Azure GPU VM

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - "nginx/**"
      - ".github/workflows/deploy-backend.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: SSH Deploy to GPU VM

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}           # VM public IP
          username: ${{ secrets.VM_USERNAME }}   # e.g. azureuser
          key: ${{ secrets.VM_SSH_KEY }}         # private SSH key

          script: |
            set -e
            cd /opt/pdve

            # Pull latest code
            git pull origin main

            # Write production env file from GitHub secret
            echo "${{ secrets.ENV_PRODUCTION }}" > .env.production

            # Rebuild and restart services (GPU worker gets latest Whisper)
            docker compose --env-file .env.production \
              up --build -d --remove-orphans

            # Clean up old images to save disk space
            docker image prune -f

            echo "Deploy complete!"
