name: Deploy to Azure VM

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - "nginx/**"
      - ".github/workflows/deploy-backend.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: SSH Deploy to VM

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}           # VM public IP
          username: ${{ secrets.VM_USERNAME }}   # e.g. azureuser
          key: ${{ secrets.VM_SSH_KEY }}         # private SSH key

          script: |
            set -e
            cd /opt/pdve

            # Ensure a clean, deterministic checkout on the VM
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            # ── DISK CLEANUP ──────────────────────────────────────────────────
            # The VM is running out of space during build. We must prune
            # aggressively BEFORE building.
            echo "Pre-build disk cleanup..."
            docker system prune -af --volumes
            docker builder prune -af

            # Write production env file from GitHub secret
            echo "${{ secrets.ENV_PRODUCTION }}" > .env.production

            # Extract NEXT_PUBLIC_API_URL from .env.production for the frontend build-arg.
            API_URL=$(grep "^NEXT_PUBLIC_API_URL=" .env.production | cut -d'=' -f2- | tr -d '\r')
            if [ -z "$API_URL" ]; then
              echo "Error: NEXT_PUBLIC_API_URL not found in ENV_PRODUCTION secret"
              exit 1
            fi

            echo "Building with NEXT_PUBLIC_API_URL=$API_URL"

            # Rebuild and restart services.
            NEXT_PUBLIC_API_URL=$API_URL docker compose --env-file .env.production \
              up --build -d --remove-orphans

            # Post-build prune to keep the disk lean
            docker image prune -f

            echo "Deploy complete!"
