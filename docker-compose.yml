# PromptDrivenVideoEditor — GPU VM Docker Compose
#
# Usage on the Azure GPU VM:
#   1. Copy .env.example to .env.production and fill in secrets
#   2. docker compose --env-file .env.production up --build -d
#
# Architecture: single GPU VM running all services.
# The NVIDIA GPU is passed through to the worker container only.
# The API stays on CPU (it just routes requests; no ML inference).

version: "3.9"

services:
  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

  # ── FastAPI API (CPU only — just routes HTTP, no ML) ──────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - job_storage:/app/storage/jobs
    env_file:
      - .env.production
    environment:
      PDVE_QUEUE_ENABLED: "true"
      PDVE_REDIS_URL: "redis://redis:6379/0"
      PDVE_STORAGE_BASE: "/app/storage/jobs"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── RQ Worker (GPU — runs Whisper, SigLIP, face detection) ───────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "worker/worker.py"]
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - job_storage:/app/storage/jobs
    env_file:
      - .env.production
    environment:
      PDVE_QUEUE_ENABLED: "true"
      PDVE_REDIS_URL: "redis://redis:6379/0"
      PDVE_STORAGE_BASE: "/app/storage/jobs"
      # GPU-optimised settings for production
      PDVE_WHISPER_MODEL: "large-v3"
      PDVE_WHISPER_DEVICE: "cuda"
      PDVE_WHISPER_COMPUTE_TYPE: "float16"
      PDVE_USE_WHISPERX_ALIGNMENT: "true"
      PDVE_VISUAL_SCORING_ENABLED: "true"
    # ── GPU passthrough ──────────────────────────────────────────────────
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    runtime: nvidia   # requires nvidia-container-toolkit on the VM

  # ── Next.js Frontend ──────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"

  # ── Nginx Reverse Proxy ───────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - api
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  job_storage:
    driver: local
  redis_data:
    driver: local
