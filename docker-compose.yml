# PromptDrivenVideoEditor â€” CPU VM Docker Compose
#
# Usage on the Azure CPU VM:
#   1. Copy .env.example to .env.production and fill in secrets
#      (Make sure PDVE_AZURE_SPEECH_KEY is set to offload transcription!)
#   2. docker compose --env-file .env.production up --build -d
#
# Architecture: single CPU VM running all services.
# The worker runs on CPU but offloads ML to Azure Speech for speed.



services:
  # â”€â”€ Redis â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

  # â”€â”€ FastAPI API (CPU only â€” just routes HTTP, no ML) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - job_storage:/app/storage/jobs
    env_file:
      - .env.production
    environment:
      PDVE_QUEUE_ENABLED: "true"
      PDVE_REDIS_URL: "redis://redis:6379/0"
      PDVE_STORAGE_BASE: "/app/storage/jobs"
      MPLCONFIGDIR: "/tmp/matplotlib"
      HF_HOME: "/tmp/huggingface"
      TORCH_HOME: "/tmp/torch"
      NUMBA_CACHE_DIR: "/tmp/numba"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 60s
      timeout: 30s
      retries: 10

  # â”€â”€ RQ Worker (GPU â€” runs Whisper, SigLIP, face detection) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "worker/worker.py"]
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - job_storage:/app/storage/jobs
    env_file:
      - .env.production
    environment:
      PDVE_QUEUE_ENABLED: "true"
      PDVE_REDIS_URL: "redis://redis:6379/0"
      MPLCONFIGDIR: "/tmp/matplotlib"
      HF_HOME: "/tmp/huggingface"
      TORCH_HOME: "/tmp/torch"
      NUMBA_CACHE_DIR: "/tmp/numba"
      PDVE_STORAGE_BASE: "/app/storage/jobs"
      # CPU-optimised settings (offloading to Azure Speech API)
      PDVE_WHISPER_MODEL: "medium"
      PDVE_WHISPER_DEVICE: "cpu"
      PDVE_WHISPER_COMPUTE_TYPE: "float32"
      PDVE_USE_WHISPERX_ALIGNMENT: "false"
      PDVE_VISUAL_SCORING_ENABLED: "true"

  # â”€â”€ Next.js Frontend â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"

  # â”€â”€ Nginx Reverse Proxy â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - api
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  job_storage:
    driver: local
  redis_data:
    driver: local

