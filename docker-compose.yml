# PromptDrivenVideoEditor — CPU VM Docker Compose
#
# Usage on the Azure CPU VM:
#   1. Copy .env.example to .env.production and fill in secrets
#      (Make sure PDVE_AZURE_SPEECH_KEY is set to offload transcription!)
#   2. docker compose --env-file .env.production up --build -d
#
# Architecture: single CPU VM running all services.
# The worker runs on CPU but offloads ML to Azure Speech for speed.

version: "3.9"

services:
  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

  # ── FastAPI API (CPU only — just routes HTTP, no ML) ──────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - job_storage:/app/storage/jobs
    env_file:
      - .env.production
    environment:
      PDVE_QUEUE_ENABLED: "true"
      PDVE_REDIS_URL: "redis://redis:6379/0"
      PDVE_STORAGE_BASE: "/app/storage/jobs"
      MPLCONFIGDIR: "/tmp/matplotlib"
      HF_HOME: "/tmp/huggingface"
      TORCH_HOME: "/tmp/torch"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 60s
      timeout: 30s
      retries: 10

  # ── RQ Worker (GPU — runs Whisper, SigLIP, face detection) ───────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "worker/worker.py"]
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - job_storage:/app/storage/jobs
    env_file:
      - .env.production
    environment:
      PDVE_QUEUE_ENABLED: "true"
      PDVE_REDIS_URL: "redis://redis:6379/0"
      PDVE_STORAGE_BASE: "/app/storage/jobs"
      MPLCONFIGDIR: "/tmp/matplotlib"
      HF_HOME: "/tmp/huggingface"
      TORCH_HOME: "/tmp/torch"
      # CPU-optimised settings (offloading to Azure Speech API)
      PDVE_WHISPER_MODEL: "medium"
      PDVE_WHISPER_DEVICE: "cpu"
      PDVE_WHISPER_COMPUTE_TYPE: "float32"
      PDVE_USE_WHISPERX_ALIGNMENT: "false"
      PDVE_VISUAL_SCORING_ENABLED: "true"

  # ── Next.js Frontend ──────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"

  # ── Nginx Reverse Proxy ───────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - api
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  job_storage:
    driver: local
  redis_data:
    driver: local
